name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_study
          POSTGRES_PASSWORD: ai_study_password
          POSTGRES_DB: ai_study_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ai_study"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run all checks
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://ai_study:ai_study_password@localhost:5433/ai_study_test
        run: python -m pytest -q
