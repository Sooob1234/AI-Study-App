name: Live checks
on:
  push:
    branches: ["live/**"]
permissions:
  contents: read
jobs:
  ytdlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install yt-dlp youtube-transcript-api
      - name: Try yt-dlp from this network
        run: |
          for id in jNQXAC9IVRw UF8uR6Z6KLc; do
            for client in default "android" "tv" "web_safari" "mweb" "ios"; do
              args=""; [ "$client" != default ] && args="--extractor-args youtube:player_client=$client"
              out=$(yt-dlp $args -f "bestaudio/best" --no-playlist --max-filesize 30M -o "/tmp/a_${id}_${client}.%(ext)s" "https://www.youtube.com/watch?v=$id" 2>&1 | tail -3 | tr '\n' ' ')
              size=$(ls -la /tmp/a_${id}_${client}.* 2>/dev/null | awk '{print $5}' | head -1)
              echo "::notice title=yt-dlp $id $client::size=[$size] ${out:0:400}"
            done
            subs=$(yt-dlp --skip-download --write-auto-subs --write-subs --sub-langs "en.*,fa.*" --sub-format json3 -o "/tmp/s_$id" "https://www.youtube.com/watch?v=$id" 2>&1 | tail -2 | tr '\n' ' ')
            echo "::notice title=yt-dlp subs $id::files=[$(ls /tmp | grep s_$id | tr '\n' ' ')] ${subs:0:300}"
          done
          yt-dlp --version
