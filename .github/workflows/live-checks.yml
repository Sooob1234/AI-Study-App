name: Live checks

on:
  push:
    branches: ["live/**"]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [small, medium, large-v3-turbo, large-v3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-audio.txt
      - name: Transcribe the sample
        env:
          WHISPER_MODEL: ${{ matrix.model }}
        run: python backend/scripts/compare_models.py samples/sample-fa.ogg
