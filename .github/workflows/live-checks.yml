name: Live checks
on:
  push:
    branches: ["live/**"]
permissions:
  contents: read
jobs:
  llm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ["gemma3:4b", "qwen2.5:7b", "llama3.2:3b", "gemma3:12b"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sleep 5
          ollama --version
      - name: Pull model
        run: |
          start=$(date +%s)
          ollama pull "${{ matrix.model }}"
          echo "::notice title=${{ matrix.model }} pull::$(( $(date +%s) - start ))s $(ollama list | tail -1)"
      - name: Experiment
        env:
          AI_MODEL: ${{ matrix.model }}
        run: python3 backend/scripts/llm_experiment.py
